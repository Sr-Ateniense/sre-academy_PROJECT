apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-app
  namespace: sre-academy
  labels:
    app.kubernetes.io/name: sre-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-demo-app
    spec:
      containers:
        - name: app
          image: sre-demo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sre-demo-app
  namespace: sre-academy
spec:
  selector:
    app.kubernetes.io/name: sre-demo-app
  ports:
    - name: http
      port: 3000
      targetPort: http
