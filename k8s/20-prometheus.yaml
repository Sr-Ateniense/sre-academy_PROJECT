apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: sre-demo-app
        metrics_path: /metrics
        static_configs:
          - targets: ["sre-demo-app.sre-academy.svc.cluster.local:3000"]
  alert-rules.yml: |
    groups:
      - name: sre-demo-app
        rules:
          - alert: SREDemoAppDown
            expr: up{job="sre-demo-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: SRE demo API is unreachable
              description: Prometheus has failed to scrape the API for one minute.
          - alert: SREDemoHighErrorRate
            expr: sum(rate(sre_demo_http_requests_total{job="sre-demo-app",status=~"5.."}[5m])) / clamp_min(sum(rate(sre_demo_http_requests_total{job="sre-demo-app"}[5m])), 0.001) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Elevated API error rate
              description: More than 5% of API requests returned 5xx responses for two minutes.
          - alert: SREDemoHighLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(sre_demo_http_request_duration_seconds_bucket{job="sre-demo-app"}[5m]))) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: API p95 latency is high
              description: The 95th percentile request latency exceeded 500ms for two minutes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sre-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sre-monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
