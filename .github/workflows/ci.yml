name: CI validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app, image, and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check app/server.js

      - name: Run API and metrics smoke test
        run: node --test app/server.test.js

      - name: Render Kubernetes resources with Kustomize
        run: kubectl kustomize k8s/ > /dev/null

      - name: Build application image
        run: docker build -t sre-demo-app:${{ github.sha }} .

