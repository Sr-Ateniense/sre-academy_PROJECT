name: CI and local Minikube CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app, image, and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check app/server.js

      - name: Run API and metrics smoke test
        run: node --test app/server.test.js

      - name: Render Kubernetes resources with Kustomize
        run: kubectl kustomize k8s/ > /dev/null

      - name: Build application image
        run: docker build -t sre-demo-app:${{ github.sha }} .

  deploy-local:
    name: Deploy app to local Minikube
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.ENABLE_MINIKUBE_CD == 'true'
    needs: validate
    runs-on: [self-hosted, windows, minikube]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Minikube and Kubernetes access
        shell: pwsh
        run: |
          minikube status
          kubectl get deployment sre-demo-app -n sre-academy

      - name: Build application image for this commit
        shell: pwsh
        run: docker build --tag "sre-demo-app:${{ github.sha }}" .

      - name: Load image into Minikube
        shell: pwsh
        run: minikube image load "sre-demo-app:${{ github.sha }}"

      - name: Update app deployment
        shell: pwsh
        run: kubectl set image deployment/sre-demo-app app="sre-demo-app:${{ github.sha }}" -n sre-academy

      - name: Wait for app rollout
        shell: pwsh
        run: kubectl rollout status deployment/sre-demo-app -n sre-academy --timeout=180s
